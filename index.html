<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!-- META PWA & MOBILE APP -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kas Madrasah</title>

<!-- FONT GOOGLE (Plus Jakarta Sans) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN SYSTEM (ELEGANT & PROFESSIONAL)
   ============================================================ */
:root {
  --primary: #0f766e;        /* Teal / Emerald */
  --primary-hover: #115e59;
  --primary-light: #ccfbf1;
  --bg-body: #f8fafc;        /* Slate 50 */
  --bg-card: #ffffff;
  --text-main: #0f172a;      /* Slate 900 */
  --text-muted: #64748b;     /* Slate 500 */
  --border: #e2e8f0;
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --nav-height: 70px;
}

[data-theme="dark"] {
  --primary: #14b8a6;        /* Teal Light */
  --primary-hover: #0d9488;
  --primary-light: #134e4a;
  --bg-body: #0f172a;        /* Slate 900 */
  --bg-card: #1e293b;        /* Slate 800 */
  --text-main: #f1f5f9;      /* Slate 100 */
  --text-muted: #94a3b8;     /* Slate 400 */
  --border: #334155;         /* Slate 700 */
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background-color: var(--bg-body); color: var(--text-main);
  font-size: 14px; line-height: 1.5;
  transition: background-color 0.3s, color 0.3s;
}

h1, h2, h3, h4 { margin: 0 0 8px 0; font-weight: 700; color: var(--text-main); }
h1 { font-size: 22px; letter-spacing: -0.5px; }
h2 { font-size: 18px; letter-spacing: -0.3px; }
h3 { font-size: 16px; }

/* Typography & Utilities */
.text-muted { color: var(--text-muted); font-size: 13px; }
.font-bold { font-weight: 700; }
.text-center { text-align: center; }

/* Forms */
input, select, textarea, button { font-family: inherit; font-size: 14px; }
input, select, textarea {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background-color: var(--bg-card); color: var(--text-main);
  transition: all 0.2s; margin-bottom: 4px;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}
.fld { margin-bottom: 16px; }
.fld label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--text-muted); }

/* Buttons */
button {
  padding: 10px 16px; border-radius: var(--radius-md);
  font-weight: 600; border: 1px solid transparent;
  cursor: pointer; transition: all 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:active { transform: scale(0.97); }
button.primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }
button.primary:hover { background: var(--primary-hover); }
button.outline { background: transparent; border-color: var(--border); color: var(--text-main); }
button.outline:hover { background: var(--bg-body); }
button.danger { background: var(--danger); color: #fff; }
button.success { background: var(--success); color: #fff; }
button.sm { padding: 6px 12px; font-size: 12px; }
button.xs { padding: 4px 8px; font-size: 11px; border-radius: 6px; }

/* Cards */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px;
  box-shadow: var(--shadow-sm); margin-bottom: 16px;
}

/* Badges */
.badge { padding: 4px 10px; border-radius: var(--radius-full); font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
.badge.s { background: #d1fae5; color: #065f46; }
.badge.d { background: #fee2e2; color: #991b1b; }
.badge.w { background: #fef3c7; color: #92400e; }

/* Tables */
.table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-card); }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
th { background: var(--bg-body); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-body); }

/* Money */
.money { font-family: 'SF Mono', Consolas, monospace; font-weight: 600; white-space: nowrap; }
.money.pos { color: var(--success); }
.money.neg { color: var(--danger); }

/* ============================================================
   LAYOUT: DESKTOP (SIDEBAR) & MOBILE (BOTTOM NAV)
   ============================================================ */
#app { display: flex; min-height: 100vh; }

/* -- SIDEBAR (Desktop) -- */
.sidebar {
  width: 260px; background: var(--bg-card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
}
.brand { padding: 24px 20px; font-size: 18px; font-weight: 800; border-bottom: 1px solid var(--border); color: var(--primary); }
.brand small { display: block; font-size: 12px; color: var(--text-muted); font-weight: 500; margin-top: 4px; }
.nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  color: var(--text-muted); text-decoration: none; border-radius: var(--radius-md);
  font-weight: 600; margin-bottom: 4px; cursor: pointer; transition: all 0.2s;
}
.nav a:hover { background: var(--bg-body); color: var(--text-main); }
.nav a.active { background: var(--primary-light); color: var(--primary); }
.nav .ico { font-size: 18px; }
.sidebar .foot { padding: 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
.sidebar .foot a { font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; gap: 8px; align-items: center;}
.sidebar .foot a:hover { color: var(--primary); }

/* -- MAIN CONTENT -- */
main { flex: 1; margin-left: 260px; padding: 24px 32px; max-width: 100%; min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }

/* ============================================================
   STAT CARDS (DASHBOARD)
   ============================================================ */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
.stat .lbl { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.stat .val { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.stat .val.pos { color: var(--success); }
.stat .val.neg { color: var(--danger); }

/* ============================================================
   DIALOGS & TOASTS
   ============================================================ */
dialog { border: none; border-radius: var(--radius-lg); padding: 0; background: var(--bg-card); color: var(--text-main); box-shadow: var(--shadow-lg); max-width: 500px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
.dlg-hd { padding: 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 16px; }
.dlg-bd { padding: 20px; max-height: 70vh; overflow-y: auto; }
.dlg-ft { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background: var(--bg-body); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); padding: 12px 24px; border-radius: var(--radius-full); color: #fff; background: var(--text-main); font-weight: 600; box-shadow: var(--shadow-lg); opacity: 0; transition: all 0.3s; z-index: 9999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

/* ============================================================
   MOBILE APP UI (BOTTOM NAV & FAB)
   ============================================================ */
.bottom-nav { display: none; }
.fab { display: none; }

@media (max-width: 900px) {
  .sidebar { display: none; }
  main { margin-left: 0; padding: 20px 16px 100px 16px; }
  .topbar { margin-bottom: 16px; }
  h1 { font-size: 20px; }
  
  /* Bottom Nav Layout */
  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-card); border-top: 1px solid var(--border);
    height: var(--nav-height); justify-content: space-around; align-items: center;
    z-index: 100; padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
  }
  .bottom-nav a {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-muted); text-decoration: none; font-size: 10px; font-weight: 600;
    flex: 1; height: 100%; gap: 4px; cursor: pointer;
  }
  .bottom-nav a .ico { font-size: 20px; }
  .bottom-nav a.active { color: var(--primary); }
  .bottom-nav a.active .ico { transform: translateY(-2px); transition: transform 0.2s; }

  /* FAB (Tombol Tambah Melayang) */
  .fab {
    display: flex; position: fixed; bottom: calc(var(--nav-height) + 16px); right: 20px;
    width: 56px; height: 56px; border-radius: var(--radius-full);
    background: var(--primary); color: #fff; font-size: 24px;
    box-shadow: var(--shadow-lg); z-index: 101; border: none;
    align-items: center; justify-content: center; cursor: pointer;
  }
  .fab:active { transform: scale(0.9); }
  
  /* Penyesuaian Table di HP */
  .table-wrap { border-radius: var(--radius-md); }
  th, td { padding: 12px; font-size: 13px; }
}

@media print {
  .sidebar, .topbar, .bottom-nav, .fab, .no-print { display: none !important; }
  main { margin: 0; padding: 0; }
  .card { box-shadow: none; border: 1px solid #ddd; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   LOGIKA APLIKASI (TIDAK BERUBAH)
   ============================================================ */
const Store = {
  KEY: 'kas_madrasah_v2',
  data: null,
  default() {
    const y = new Date().getFullYear();
    return {
      settings: { namaMadrasah:'', alamat:'', kepala:'', tahunAjaran:y+'/'+(y+1), nominalSPP:50000, pin:'', theme:'light' },
      murid: [], guru: [], kelas: [], kategori: [], transaksi: [], spp: [], tabungan: []
    };
  },
  load() {
    let d; try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch { d = null; }
    if (!d || typeof d !== 'object') d = this.default();
    const def = this.default();
    for (const k in def) if (d[k] === undefined) d[k] = def[k];
    for (const k in def.settings) if (d.settings[k] === undefined) d.settings[k] = def.settings[k];
    this.data = d; return d;
  },
  save() { localStorage.setItem(this.KEY, JSON.stringify(this.data)); },
  id() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); },
  add(c, item) { item.id = item.id || this.id(); this.data[c].push(item); this.save(); return item; },
  update(c, id, patch) { const i = this.data[c].findIndex(x => x.id === id); if (i < 0) return; this.data[c][i] = { ...this.data[c][i], ...patch }; this.save(); },
  remove(c, id) { this.data[c] = this.data[c].filter(x => x.id !== id); this.save(); },
  find(c, id) { return this.data[c].find(x => x.id === id); }
};

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_S = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const UI = {
  fmt(n){ return 'Rp ' + (Number(n)||0).toLocaleString('id-ID'); },
  today(){ return new Date().toISOString().slice(0,10); },
  fmtDate(d){ if(!d) return '-'; const x = new Date(d); return isNaN(x) ? '-' : x.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); },
  esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  toast(msg,type=''){ const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add('show')); setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2600); },
  confirm(m){ return window.confirm(m); }
};

const Auth = {
  isSetup(){ return !!Store.data.settings.pin; },
  isLoggedIn(){ return sessionStorage.getItem('kas_auth') === '1'; },
  login(pin){ if (String(pin) === String(Store.data.settings.pin)) { sessionStorage.setItem('kas_auth','1'); return true; } return false; },
  setup(pin){ if (!pin || String(pin).length < 4) return false; Store.data.settings.pin = String(pin); Store.save(); sessionStorage.setItem('kas_auth','1'); return true; },
  logout(){ sessionStorage.removeItem('kas_auth'); App.render(); }
};

const App = {
  view: 'dashboard',
  render() {
    const root = document.getElementById('app');
    if (!Auth.isSetup()) { root.innerHTML = Views.setup(); return; }
    if (!Auth.isLoggedIn()) { root.innerHTML = Views.login(); return; }
    document.documentElement.dataset.theme = Store.data.settings.theme || 'light';
    root.innerHTML = Views.shell();
    const v = document.getElementById('view');
    v.innerHTML = Views[this.view] ? Views[this.view]() : '<div class="empty">Halaman tidak ditemukan</div>';
    
    // Update active state di Sidebar Desktop & Bottom Nav Mobile
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === this.view));
  },
  nav(v){ this.view = v; location.hash = v; this.render(); window.scrollTo(0,0); }
};

const Views = {
  setup() {
    return `<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-body);padding:20px;z-index:9999">
      <div class="card" style="width:100%;max-width:400px">
        <div class="text-center" style="margin-bottom:24px">
          <div style="font-size:40px;margin-bottom:8px">🌱</div>
          <h2>Setup Awal</h2>
          <p class="text-muted">Buat PIN keamanan untuk pertama kali</p>
        </div>
        <form data-form="setup">
          <div class="fld"><label>Nama Madrasah</label><input name="nama" required placeholder="MI Al-Hidayah"></div>
          <div class="fld"><label>Tahun Ajaran</label><input name="tahun" value="${UI.esc(Store.data.settings.tahunAjaran)}" required></div>
          <div class="fld"><label>PIN Admin</label><input name="pin" type="password" inputmode="numeric" minlength="4" required></div>
          <div class="fld"><label>Ulangi PIN</label><input name="pin2" type="password" inputmode="numeric" minlength="4" required></div>
          <button class="primary" style="width:100%;margin-top:8px">Simpan & Masuk</button>
        </form>
      </div>
    </div>`;
  },
  login() {
    return `<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-body);padding:20px;z-index:9999">
      <div class="card" style="width:100%;max-width:360px;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">🔐</div>
        <h2 style="margin-bottom:4px">Kas Madrasah</h2>
        <p class="text-muted" style="margin-bottom:24px">${UI.esc(Store.data.settings.namaMadrasah || 'Silakan masuk')}</p>
        <form data-form="login">
          <div class="fld"><input name="pin" type="password" inputmode="numeric" placeholder="Masukkan PIN" style="text-align:center;font-size:20px;letter-spacing:4px" required autofocus></div>
          <button class="primary" style="width:100%">Buka Aplikasi</button>
        </form>
      </div>
    </div>`;
  },
  shell() {
    const nav = [
      ['dashboard','📊','Dashboard'],
      ['murid','👦','Data Murid'],
      ['guru','👨‍🏫','Data Guru'],
      ['kelas','🏫','Data Kelas'],
      ['kategori','🏷️','Kategori'],
      ['transaksi','💵','Transaksi Kas'],
      ['spp','🎓','Pembayaran SPP'],
      ['tabungan','🏦','Tabungan Siswa'],
      ['laporan','📄','Laporan'],
      ['backup','💾','Backup'],
      ['settings','⚙️','Pengaturan']
    ];
    
    // Menu Fokus untuk Bottom Nav di HP (Maks 5)
    const mobileNav = [
      ['dashboard','📊','Home'],
      ['transaksi','💵','Kas'],
      ['spp','🎓','SPP'],
      ['laporan','📄','Laporan'],
      ['settings','⚙️','Setting']
    ];

    return `
    <!-- SIDEBAR (DESKTOP) -->
    <aside class="sidebar">
      <div class="brand">Kas Madrasah<small>${UI.esc(Store.data.settings.namaMadrasah || 'Sistem Informasi')}</small></div>
      <nav class="nav">${nav.map(([k,i,t]) => `<a data-nav="${k}" href="#${k}"><span class="ico">${i}</span>${t}</a>`).join('')}</nav>
      <div class="foot">
        <a data-action="toggle-theme"><span class="ico">${Store.data.settings.theme==='dark'?'☀️':'🌙'}</span> Mode ${Store.data.settings.theme==='dark'?'Terang':'Gelap'}</a>
        <a data-action="logout"><span class="ico">🚪</span> Keluar</a>
      </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main><div id="view"></div></main>

    <!-- BOTTOM NAV (MOBILE) -->
    <nav class="bottom-nav">
      ${mobileNav.map(([k,i,t]) => `<a data-nav="${k}" href="#${k}"><span class="ico">${i}</span>${t}</a>`).join('')}
    </nav>
    
    <!-- FAB (Tombol Melayang Khusus HP) -->
    <button class="fab" data-action="fab-action">+</button>
    `;
  },

  dashboard() {
    const d = Store.data;
    const now = new Date();
    const saldo = d.transaksi.reduce((s,t) => s + (t.jenis==='masuk'?1:-1)*(+t.jumlah||0), 0);
    const bulan = d.transaksi.filter(t => { const x=new Date(t.tanggal); return x.getMonth()===now.getMonth() && x.getFullYear()===now.getFullYear(); });
    const inBln = bulan.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+(+t.jumlah||0),0);
    const outBln = bulan.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+(+t.jumlah||0),0);
    const tunggakan = d.spp.filter(s=>s.status==='belum').reduce((s,x)=>s+(+x.nominal||0),0);
    const recent = [...d.transaksi].sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')).slice(0,5);

    return `<div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <span class="text-muted">Ringkasan keuangan madrasah</span>
      </div>
      <div class="card" style="padding:10px 16px;margin:0;border-radius:var(--radius-full);font-weight:600;font-size:13px;background:var(--primary-light);color:var(--primary)">
        📅 ${UI.fmtDate(new Date())}
      </div>
    </div>
    
    <div class="stat-grid">
      <div class="stat"><div class="lbl">Saldo Kas</div><div class="val ${saldo>=0?'pos':'neg'}">${UI.fmt(saldo)}</div></div>
      <div class="stat"><div class="lbl">Pemasukan Bulan Ini</div><div class="val pos">${UI.fmt(inBln)}</div></div>
      <div class="stat"><div class="lbl">Pengeluaran Bulan Ini</div><div class="val neg">${UI.fmt(outBln)}</div></div>
      <div class="stat"><div class="lbl">Tunggakan SPP</div><div class="val ${tunggakan>0?'neg':''}">${UI.fmt(tunggakan)}</div></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3>Transaksi Terakhir</h3>
        <a href="#transaksi" data-nav="transaksi" style="font-size:13px;color:var(--primary);font-weight:600;cursor:pointer">Lihat Semua →</a>
      </div>
      ${recent.length ? `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="text-right">Jumlah</th></tr></thead><tbody>
        ${recent.map(t=>`<tr><td>${UI.fmtDate(t.tanggal)}</td>
          <td><div style="font-weight:600">${UI.esc(t.keterangan||'-')}</div><div class="text-muted" style="font-size:11px">${UI.esc(t.kategori||'-')}</div></td>
          <td class="money ${t.jenis==='masuk'?'pos':'neg'} text-right">${t.jenis==='masuk'?'+':'-'} ${UI.fmt(t.jumlah)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="text-center text-muted" style="padding:32px 0">Belum ada transaksi.</div>`}
    </div>`;
  },

  murid() {
    const f = App.muridFilter || (App.muridFilter = { kelas:'', q:'' });
    let list = [...Store.data.murid];
    if (f.kelas) list = list.filter(m => m.kelas === f.kelas);
    if (f.q) { const q = f.q.toLowerCase(); list = list.filter(m => (m.nama||'').toLowerCase().includes(q) || (m.nis||'').toLowerCase().includes(q)); }

      <div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="text-right">Saldo</th></tr></thead><tbody>
        <tr><td colspan="2"><i>Saldo awal</i></td><td class="money text-right">${UI.fmt(saldoAwal)}</td></tr>
        ${rows.map(t=>`<tr>
          <td>${UI.fmtDate(t.tanggal)}</td>
          <td><div style="font-weight:600">${UI.esc(t.keterangan||'-')}</div><div class="text-muted" style="font-size:11px">${t.jenis==='masuk'?'+':'-'} ${UI.fmt(t.jumlah)}</div></td>
          <td class="money text-right">${UI.fmt(t.saldo)}</td></tr>`).join('')}
        <tr style="font-weight:700;background:var(--bg-body)"><td colspan="2">TOTAL MASUK / KELUAR</td>
          <td class="money text-right">+${UI.fmt(totalIn)}<br>-${UI.fmt(totalOut)}</td></tr>

    </div>`;

  backup() {

// Sisa fungsi logic (Dialog, Actions, Download, Event) tetap SAMA seperti sebelumnya.
// Ditempatkan di bawah sini agar kode ringkas (copy-paste file utuh).
function openDialog({ title, body, formName, submitText='Simpan', onSubmit }) {
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form method="dialog" data-form="${formName}">
    <div class="dlg-hd">${title}</div><div class="dlg-bd">${body}</div>
    <div class="dlg-ft"><button type="button" value="cancel" data-action="dlg-cancel" class="outline">Batal</button><button class="primary" value="ok">${submitText}</button></div></form>`;
  document.body.appendChild(dlg); dlg._onSubmit = onSubmit; dlg.showModal(); return dlg;
}

const Actions = {
  logout(){ if(UI.confirm('Keluar?')) Auth.logout(); },
  'toggle-theme'(){ Store.data.settings.theme = Store.data.settings.theme==='dark'?'light':'dark'; Store.save(); App.render(); },
  'dlg-cancel'(id, el){ el.closest('dialog').close(); el.closest('dialog').remove(); },
  
  // Aksi FAB (Tombol Melayang)
  'fab-action'() {
    if (App.view === 'murid') Actions['murid-add']();
    else if (App.view === 'guru') Actions['guru-add']();
    else if (App.view === 'kelas') Actions['kelas-add']();
    else if (App.view === 'kategori') Actions['kategori-add']();
    else if (App.view === 'tabungan') Actions['tabung-add']();
    else Actions['tx-add'](); // Default tambah transaksi
  },

  'submit_setup'(fd){
    const v = Object.fromEntries(fd); if (v.pin !== v.pin2) return UI.toast('PIN tidak sama','error'); if (v.pin.length < 4) return UI.toast('PIN min 4 digit','error');
    Store.data.settings.namaMadrasah = v.nama || 'Madrasah'; Store.data.settings.tahunAjaran = v.tahun || Store.data.settings.tahunAjaran;
    Auth.setup(v.pin); UI.toast('Berhasil!','success'); App.render();
  },
  'submit_login'(fd){ const v=Object.fromEntries(fd); if(Auth.login(v.pin)){ UI.toast('Selamat datang','success'); App.render(); } else UI.toast('PIN salah','error'); },
  'submit_settings'(fd){ const v=Object.fromEntries(fd); Object.assign(Store.data.settings,{...v,nominalSPP:+v.nominalSPP||0}); Store.save(); UI.toast('Tersimpan','success'); App.render(); },
  'submit_changePin'(fd){ const v=Object.fromEntries(fd);
    if(String(v.old)!==String(Store.data.settings.pin)) return UI.toast('PIN lama salah','error');
    if(String(v.new).length<4) return UI.toast('PIN baru min 4 digit','error');
    Store.data.settings.pin=String(v.new); Store.save(); UI.toast('PIN diubah','success'); },

  _submitGeneric(coll, validate, fields) {
    return (fd, form) => {
      const v = Object.fromEntries(fd); const err = validate && validate(v); if (err) return UI.toast(err,'error');
      const id = form.dataset.id; const data = fields ? fields(v) : v;
      if (id) Store.update(coll, id, data); else Store.add(coll, data);
      form.closest('dialog').remove(); UI.toast(id?'Diperbarui':'Ditambahkan','success'); App.render();
    };
  },

  'murid-add'(){ Actions._muridForm(); }, 'murid-edit'(id){ Actions._muridForm(id); },
  _muridForm(id){
    const m = id ? Store.find('murid',id) : {};
    const dlg = openDialog({ title: id?'Edit Murid':'Tambah Murid', formName:'murid',
      body: `<div class="fld"><label>Nama Lengkap *</label><input name="nama" value="${UI.esc(m.nama||'')}" required></div>
        <div class="row"><div class="fld" style="flex:1"><label>NIS</label><input name="nis" value="${UI.esc(m.nis||'')}"></div>
        <div class="fld" style="flex:1"><label>Kelas</label><input name="kelas" value="${UI.esc(m.kelas||'')}"></div></div>
        <div class="fld"><label>Jenis Kelamin</label><select name="jk"><option value="">-</option><option ${m.jk==='L'?'selected':''} value="L">Laki-laki</option><option ${m.jk==='P'?'selected':''} value="P">Perempuan</option></select></div>
        <div class="row"><div class="fld" style="flex:1"><label>Wali Murid</label><input name="wali" value="${UI.esc(m.wali||'')}"></div>
        <div class="fld" style="flex:1"><label>Telepon</label><input name="telepon" value="${UI.esc(m.telepon||'')}"></div></div>
        <div class="fld"><label>Alamat</label><textarea name="alamat" rows="2">${UI.esc(m.alamat||'')}</textarea></div>
        <div class="fld"><label><input type="checkbox" name="aktif" ${m.aktif!==false?'checked':''} style="width:auto;margin-right:8px"> Status Aktif</label></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'murid-del'(id){ if(!UI.confirm('Hapus murid ini? SPP & tabungan terkait juga dihapus.')) return;
    Store.remove('murid',id); Store.data.spp=Store.data.spp.filter(s=>s.muridId!==id); Store.data.tabungan=Store.data.tabungan.filter(t=>t.muridId!==id); Store.save();
    UI.toast('Murid dihapus','success'); App.render(); },

  'guru-add'(){ Actions._guruForm(); }, 'guru-edit'(id){ Actions._guruForm(id); },
  _guruForm(id){
    const g = id ? Store.find('guru',id) : {};
    const dlg = openDialog({ title: id?'Edit Guru':'Tambah Guru', formName:'guru',
      body: `<div class="fld"><label>Nama Lengkap *</label><input name="nama" value="${UI.esc(g.nama||'')}" required></div>
        <div class="fld"><label>NIP</label><input name="nip" value="${UI.esc(g.nip||'')}"></div>
        <div class="row"><div class="fld" style="flex:1"><label>Mapel</label><input name="mapel" value="${UI.esc(g.mapel||'')}"></div>
        <div class="fld" style="flex:1"><label>Jabatan</label><input name="jabatan" value="${UI.esc(g.jabatan||'')}"></div></div>
        <div class="fld"><label>Telepon</label><input name="telepon" value="${UI.esc(g.telepon||'')}"></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'guru-del'(id){ if(!UI.confirm('Hapus guru ini?')) return; Store.remove('guru',id); UI.toast('Dihapus','success'); App.render(); },

  'kelas-add'(){ Actions._kelasForm(); }, 'kelas-edit'(id){ Actions._kelasForm(id); },
  _kelasForm(id){
    const k = id ? Store.find('kelas',id) : {};
    const dlg = openDialog({ title: id?'Edit Kelas':'Tambah Kelas', formName:'kelas',
      body: `<div class="fld"><label>Nama Kelas *</label><input name="nama" value="${UI.esc(k.nama||'')}" required></div>
        <div class="fld"><label>Wali Kelas</label><input name="wali" value="${UI.esc(k.wali||'')}"></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'kelas-del'(id){ if(!UI.confirm('Hapus kelas ini?')) return; Store.remove('kelas',id); UI.toast('Dihapus','success'); App.render(); },

  'kategori-add'(){ Actions._kategoriForm(); }, 'kategori-edit'(id){ Actions._kategoriForm(id); },
  _kategoriForm(id){
    const k = id ? Store.find('kategori',id) : {};
    const dlg = openDialog({ title: id?'Edit Kategori':'Tambah Kategori', formName:'kategori',
      body: `<div class="fld"><label>Nama Kategori *</label><input name="nama" value="${UI.esc(k.nama||'')}" required></div>
        <div class="fld"><label>Jenis</label><select name="jenis"><option value="masuk" ${k.jenis==='masuk'?'selected':''}>Masuk</option><option value="keluar" ${k.jenis==='keluar'?'selected':''}>Keluar</option></select></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'kategori-del'(id){ if(!UI.confirm('Hapus kategori ini?')) return; Store.remove('kategori',id); UI.toast('Dihapus','success'); App.render(); },

  'tx-add'(){ Actions._txForm(); }, 'tx-edit'(id){ Actions._txForm(id); },
  _txForm(id){
    const t = id ? Store.find('transaksi',id) : { tanggal:UI.today(), jenis:'masuk' };
    const kats = Store.data.kategori.map(k=>k.nama);
    const dlg = openDialog({ title: id?'Edit Transaksi':'Tambah Transaksi', formName:'tx',
      body: `<div class="fld"><label>Tanggal *</label><input type="date" name="tanggal" value="${UI.esc(t.tanggal||UI.today())}" required></div>
        <div class="fld"><label>Jenis *</label><select name="jenis"><option value="masuk" ${t.jenis==='masuk'?'selected':''}>Pemasukan</option><option value="keluar" ${t.jenis==='keluar'?'selected':''}>Pengeluaran</option></select></div>
        <div class="fld"><label>Kategori</label><input name="kategori" list="kats" value="${UI.esc(t.kategori||'')}"><datalist id="kats">${kats.map(k=>`<option value="${UI.esc(k)}">`).join('')}</datalist></div>
        <div class="fld"><label>Jumlah (Rp) *</label><input type="number" min="1" name="jumlah" value="${t.jumlah||''}" required></div>
        <div class="fld"><label>Keterangan</label><textarea name="keterangan" rows="2">${UI.esc(t.keterangan||'')}</textarea></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'tx-del'(id){ if(!UI.confirm('Hapus transaksi ini?')) return; Store.remove('transaksi',id); UI.toast('Dihapus','success'); App.render(); },

  'spp-generate'(){
    const tahun = App.sppTahun || new Date().getFullYear();
    const murid = Store.data.murid.filter(m=>m.aktif!==false);
    if(!murid.length) return UI.toast('Belum ada murid aktif','error');
    const nominal = +Store.data.settings.nominalSPP || 0;
    if(nominal<=0) return UI.toast('Atur Nominal SPP dulu','error');
    if(!UI.confirm(`Generate SPP ${tahun} untuk ${murid.length} murid?\nNominal ${UI.fmt(nominal)}/bulan`)) return;
    let count=0;
    murid.forEach(m=>{
      const exists = Store.data.spp.some(s=>s.muridId===m.id && +s.tahun===+tahun); if(exists) return;
      for(let b=1;b<=12;b++){ Store.data.spp.push({ id:Store.id(), muridId:m.id, tahun:+tahun, bulan:b, nominal, status:'belum', tanggalBayar:null }); count++; }
    });
    Store.save(); UI.toast(`${count} tagihan dibuat`,'success'); App.render();
  },
  'spp-toggle'(id){
    const s = Store.find('spp', id); if(!s) return; const m = Store.find('murid', s.muridId);
    if(s.status==='lunas'){
      if(!UI.confirm(`Batalkan pembayaran ${m?.nama||''} ${BULAN[s.bulan-1]}?`)) return;
      Store.update('spp', id, { status:'belum', tanggalBayar:null });
      Store.data.transaksi = Store.data.transaksi.filter(t=>t.referensi!==id); Store.save(); UI.toast('Dibatalkan','warn');
    } else {
      const tgl = UI.today(); Store.update('spp', id, { status:'lunas', tanggalBayar:tgl });
      Store.add('transaksi', { tanggal:tgl, jenis:'masuk', kategori:'SPP', keterangan:`SPP ${m?.nama||''} - ${BULAN[s.bulan-1]} ${s.tahun}`, jumlah:+s.nominal, referensi:id });
      UI.toast('Pembayaran dicatat','success');
    }
    App.render();
  },
  'spp-bulk'(muridId){
    const tahun = App.sppTahun || new Date().getFullYear();
    const rows = Store.data.spp.filter(s=>s.muridId===muridId && +s.tahun===+tahun && s.status==='belum');
    if(!rows.length) return UI.toast('Semua sudah lunas','warn'); const m = Store.find('murid', muridId);
    if(!UI.confirm(`Tandai ${rows.length} tagihan lunas untuk ${m?.nama||''}?`)) return;
    rows.forEach(s=>{ const tgl = UI.today(); Store.update('spp', s.id, { status:'lunas', tanggalBayar:tgl });
      Store.add('transaksi', { tanggal:tgl, jenis:'masuk', kategori:'SPP', keterangan:`SPP ${m?.nama||''} - ${BULAN[s.bulan-1]} ${tahun}`, jumlah:+s.nominal, referensi:s.id }); });
    UI.toast(`${rows.length} tagihan dilunasi`,'success'); App.render();
  },

  'backup-export'(){ download(new Blob([JSON.stringify(Store.data,null,2)],{type:'application/json'}), `kas-madrasah-backup-${UI.today()}.json`); UI.toast('Backup diunduh','success'); },
  'backup-import'(id, el){ const file = el.files?.[0]; if(!file) return;
    const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result);
      if(!d.settings || !Array.isArray(d.transaksi)) throw new Error('Struktur salah');
      if(!UI.confirm('Data saat ini akan DIGANTI. Lanjut?')) { el.value=''; return; }
      Store.data = d; Store.save(); UI.toast('Restore berhasil','success'); App.render();
    } catch(e){ UI.toast('File salah','error'); } el.value=''; }; r.readAsText(file); },

  'print'(){ window.print(); }
};

// Helper Download Excel (Sederhana)
function download(blob, filename){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},100); }

// Event Listeners
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]'); if (btn && btn.tagName !== 'INPUT' && btn.tagName !== 'SELECT') { const fn = Actions[btn.dataset.action]; if (fn) { e.preventDefault(); fn(btn.dataset.id, btn); return; } }
  const nav = e.target.closest('[data-nav]'); if (nav) { e.preventDefault(); App.nav(nav.dataset.nav); }
});
document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]'); if (!form) return; e.preventDefault();
  const fn = Actions['submit_' + form.dataset.form]; if (fn) { fn(new FormData(form), form); const dlg = form.closest('dialog'); if (dlg && dlg.open) { dlg.close(); if (dlg.parentNode) dlg.remove(); } }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (['bulan','jenis','kategori'].includes(el.dataset.filter)) { App.txFilter = App.txFilter||{}; App.txFilter[el.dataset.filter] = el.value; App.render(); }
  if (el.dataset.filter === 'sppTahun') { App.sppTahun = +el.value; App.render(); }
  if (el.dataset.filter === 'sppKelas') { App.sppFilter = App.sppFilter||{}; App.sppFilter.kelas = el.value; App.render(); }
  if (el.dataset.filter === 'muridKelas') { App.muridFilter = App.muridFilter||{}; App.muridFilter.kelas = el.value; App.render(); }
  if (el.dataset.filter === 'lapDari' || el.dataset.filter === 'lapSampai') { App.lapFilter = App.lapFilter||{}; App.lapFilter[el.dataset.filter==='lapDari'?'dari':'sampai'] = el.value; App.render(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.filter === 'muridQ') { clearTimeout(window._mq); window._mq = setTimeout(()=>{ App.muridFilter=App.muridFilter||{}; App.muridFilter.q = el.value; App.render(); }, 300); }
  if (el.dataset.filter === 'txQ') { clearTimeout(window._tq); window._tq = setTimeout(()=>{ App.txFilter=App.txFilter||{}; App.txFilter.q = el.value; App.render(); }, 300); }
});

Store.load(); App.render();
window.addEventListener('hashchange', () => { const v = location.hash.replace('#',''); if (v && Views[v]) { App.view = v; App.render(); } });
</script>
</body>
