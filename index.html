<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas Madrasah — Offline Full Edition</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1a2234;--muted:#64748b;--primary:#2563eb;--primary-h:#1d4ed8;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.06);--radius:10px}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--shadow:0 1px 3px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background .2s}
h1,h2,h3{margin:0 0 .5rem}h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}
a{color:var(--primary);cursor:pointer;text-decoration:none}
input,select,textarea,button{font-family:inherit;font-size:14px}
input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);width:100%;transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
button{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-weight:500;transition:all .15s}
button:hover{background:var(--bg)}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.primary:hover{background:var(--primary-h)}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.success{background:var(--success);color:#fff;border-color:var(--success)}
button.warning{background:var(--warning);color:#fff;border-color:var(--warning)}
button.sm{padding:4px 10px;font-size:12px}
button.xs{padding:2px 8px;font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.s{background:#d1fae5;color:#065f46}
.badge.d{background:#fee2e2;color:#991b1b}
.badge.w{background:#fef3c7;color:#92400e}
.badge.i{background:#dbeafe;color:#1e40af}
#app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--card);border-right:1px solid var(--border);padding:16px 0;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border);margin-bottom:8px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.nav{flex:1}
.nav a{display:flex;gap:10px;padding:9px 20px;color:var(--text);border-left:3px solid transparent;font-size:13px;cursor:pointer}
.nav a:hover{background:var(--bg)}
.nav a.active{background:#eff6ff;color:var(--primary);border-left-color:var(--primary);font-weight:600}
[data-theme="dark"] .nav a.active{background:#1e3a8a33}
.nav .ico{font-size:15px;width:18px;text-align:center}
.sidebar .foot{padding:12px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
main{flex:1;padding:20px 24px;max-width:100%;overflow-x:hidden;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.topbar h1{margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat .val{font-size:20px;font-weight:700}
.stat .val.pos{color:var(--success)}.stat .val.neg{color:var(--danger)}
dialog{border:none;border-radius:12px;padding:0;background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:600px;width:calc(100% - 32px);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-hd{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600}
.dlg-bd{padding:20px}
.dlg-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.fld{margin-bottom:12px}
.fld label{display:block;margin-bottom:4px;font-size:12px;font-weight:500;color:var(--muted)}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:8px;color:#fff;background:#334155;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:all .25s;z-index:9999;max-width:90vw}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--success)}.toast.error{background:var(--danger)}.toast.warn{background:var(--warning)}
.auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2563eb,#1e40af);padding:20px;z-index:9999}
.auth-box{background:var(--card);border-radius:14px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-box h2{text-align:center;margin-bottom:4px}
.auth-box p{text-align:center;color:var(--muted);margin-bottom:20px;font-size:13px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-bar>*{flex:0 0 auto}
.filter-bar input,.filter-bar select{min-width:130px;max-width:180px}
.money{font-family:'SF Mono',Menlo,monospace;text-align:right;white-space:nowrap}
.money.pos{color:var(--success);font-weight:600}
.money.neg{color:var(--danger);font-weight:600}
.actions-cell{display:flex;gap:4px;justify-content:flex-end}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 0;border-bottom:2px solid var(--border)}
.chart .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.chart .bar{display:flex;align-items:flex-end;gap:2px;height:150px;width:100%;justify-content:center}
.chart .bar>div{width:10px;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.chart .bar .in{background:var(--success)}
.chart .bar .out{background:var(--danger)}
.chart .lbl{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;margin-top:8px;justify-content:center;color:var(--muted)}
.legend span::before{content:'■';margin-right:4px}
.legend .in::before{color:var(--success)}
.legend .out::before{color:var(--danger)}
.spp-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.spp-grid button{padding:4px 0;font-size:11px;min-width:0}
.kuitansi{border:2px dashed var(--border);border-radius:8px;padding:20px;background:var(--card);max-width:400px;margin:0 auto}
.kuitansi h3{text-align:center;margin-bottom:4px}
.kuitansi .sub{text-align:center;font-size:11px;color:var(--muted);margin-bottom:14px;border-bottom:1px dashed var(--border);padding-bottom:10px}
.kuitansi table{font-size:12px}
.kuitansi td{border:none;padding:3px 0}
.kuitansi td:first-child{width:40%;color:var(--muted)}
@media(max-width:768px){#app{flex-direction:column}.sidebar{width:100%;flex-direction:row;padding:8px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);height:auto;position:static}.brand,.sidebar .foot{display:none}.nav{display:flex;gap:4px}.nav a{padding:8px 12px;border-left:none;border-radius:8px;white-space:nowrap;font-size:12px}.nav a.active{border-left:none}.nav .ico{display:none}main{padding:16px}}
@media print{.sidebar,.topbar,.no-print,.filter-bar{display:none!important}main{padding:0}.card{box-shadow:none;border:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   KAS MADRASAH — OFFLINE FULL EDITION
   localStorage + JSON backup. Tanpa backend, tanpa database server.
   ============================================================ */

/* ---------- STORE ---------- */
const Store = {
  KEY: 'kas_madrasah_v2',
  data: null,
  default() {
    const y = new Date().getFullYear();
    return {
      settings: { namaMadrasah:'', alamat:'', kepala:'', tahunAjaran:y+'/'+(y+1), nominalSPP:50000, pin:'', theme:'light' },
      murid: [], guru: [], kelas: [], kategori: [], transaksi: [], spp: [], tabungan: []
    };
  },
  load() {
    let d;
    try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch { d = null; }
    if (!d || typeof d !== 'object') d = this.default();
    const def = this.default();
    for (const k in def) if (d[k] === undefined) d[k] = def[k];
    for (const k in def.settings) if (d.settings[k] === undefined) d.settings[k] = def.settings[k];
    this.data = d;
    return d;
  },
  save() { localStorage.setItem(this.KEY, JSON.stringify(this.data)); },
  id() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); },
  add(c, item) { item.id = item.id || this.id(); this.data[c].push(item); this.save(); return item; },
  update(c, id, patch) { const i = this.data[c].findIndex(x => x.id === id); if (i < 0) return; this.data[c][i] = { ...this.data[c][i], ...patch }; this.save(); },
  remove(c, id) { this.data[c] = this.data[c].filter(x => x.id !== id); this.save(); },
  find(c, id) { return this.data[c].find(x => x.id === id); }
};

/* ---------- HELPERS ---------- */
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_S = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const UI = {
  fmt(n){ return 'Rp ' + (Number(n)||0).toLocaleString('id-ID'); },
  today(){ return new Date().toISOString().slice(0,10); },
  fmtDate(d){ if(!d) return '-'; const x = new Date(d); return isNaN(x) ? '-' : x.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); },
  esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  toast(msg,type=''){ const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add('show')); setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2600); },
  confirm(m){ return window.confirm(m); }
};

/* ---------- AUTH ---------- */
const Auth = {
  isSetup(){ return !!Store.data.settings.pin; },
  isLoggedIn(){ return sessionStorage.getItem('kas_auth') === '1'; },
  login(pin){ if (String(pin) === String(Store.data.settings.pin)) { sessionStorage.setItem('kas_auth','1'); return true; } return false; },
  setup(pin){ if (!pin || String(pin).length < 4) return false; Store.data.settings.pin = String(pin); Store.save(); sessionStorage.setItem('kas_auth','1'); return true; },
  logout(){ sessionStorage.removeItem('kas_auth'); App.render(); }
};

/* ---------- APP / ROUTER ---------- */
const App = {
  view: 'dashboard',
  render() {
    const root = document.getElementById('app');
    if (!Auth.isSetup()) { root.innerHTML = Views.setup(); return; }
    if (!Auth.isLoggedIn()) { root.innerHTML = Views.login(); return; }
    document.documentElement.dataset.theme = Store.data.settings.theme || 'light';
    root.innerHTML = Views.shell();
    const v = document.getElementById('view');
    v.innerHTML = Views[this.view] ? Views[this.view]() : '<div class="empty">Halaman tidak ditemukan</div>';
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === this.view));
  },
  nav(v){ this.view = v; location.hash = v; this.render(); }
};

/* ---------- VIEWS ---------- */
const Views = {
  /* setup */
  setup() {
    return `<div class="auth-screen"><div class="auth-box">
      <h2>🌱 Setup Awal</h2>
      <p>Buat PIN admin (min. 4 digit)</p>
      <form data-form="setup">
        <div class="fld"><label>Nama Madrasah</label><input name="nama" required placeholder="MI Al-Hidayah"></div>
        <div class="fld"><label>Tahun Ajaran</label><input name="tahun" value="${UI.esc(Store.data.settings.tahunAjaran)}" required></div>
        <div class="fld"><label>PIN Admin</label><input name="pin" type="password" inputmode="numeric" minlength="4" required></div>
        <div class="fld"><label>Ulangi PIN</label><input name="pin2" type="password" inputmode="numeric" minlength="4" required></div>
        <button class="primary" style="width:100%">Simpan & Masuk</button>
      </form></div></div>`;
  },
  /* login */
  login() {
    return `<div class="auth-screen"><div class="auth-box">
      <h2>🔐 Kas Madrasah</h2>
      <p>${UI.esc(Store.data.settings.namaMadrasah || 'Masuk ke aplikasi')}</p>
      <form data-form="login">
        <div class="fld"><label>PIN</label><input name="pin" type="password" inputmode="numeric" required autofocus></div>
        <button class="primary" style="width:100%">Masuk</button>
      </form></div></div>`;
  },
  /* shell */
  shell() {
    const nav = [
      ['dashboard','📊','Dashboard'],
      ['murid','👦','Data Murid'],
      ['guru','👨‍🏫','Data Guru'],
      ['kelas','🏫','Data Kelas'],
      ['kategori','🏷️','Kategori'],
      ['transaksi','💵','Transaksi Kas'],
      ['spp','🎓','Pembayaran SPP'],
      ['tabungan','🏦','Tabungan Siswa'],
      ['laporan','📄','Laporan'],
      ['backup','💾','Backup / Restore'],
      ['settings','⚙️','Pengaturan']
    ];
    return `<aside class="sidebar">
      <div class="brand">Kas Madrasah<small>${UI.esc(Store.data.settings.namaMadrasah || 'Offline Edition')}</small></div>
      <nav class="nav">${nav.map(([k,i,t]) => `<a data-nav="${k}" href="#${k}"><span class="ico">${i}</span>${t}</a>`).join('')}</nav>
      <div class="foot">
        <a data-action="toggle-theme">${Store.data.settings.theme==='dark'?'☀️ Terang':'🌙 Gelap'}</a>
        <a data-action="logout">🚪 Keluar</a>
      </div></aside>
      <main><div id="view"></div></main>`;
  },

  /* dashboard */
  dashboard() {
    const d = Store.data;
    const now = new Date();
    const saldo = d.transaksi.reduce((s,t) => s + (t.jenis==='masuk'?1:-1)*(+t.jumlah||0), 0);
    const bulan = d.transaksi.filter(t => { const x=new Date(t.tanggal); return x.getMonth()===now.getMonth() && x.getFullYear()===now.getFullYear(); });
    const inBln = bulan.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+(+t.jumlah||0),0);
    const outBln = bulan.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+(+t.jumlah||0),0);
    const tunggakan = d.spp.filter(s=>s.status==='belum').reduce((s,x)=>s+(+x.nominal||0),0);
    const saldoTabungan = d.tabungan.reduce((s,t)=>s+(t.jenis==='setor'?1:-1)*(+t.jumlah||0),0);
    const recent = [...d.transaksi].sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')).slice(0,8);

    // chart 6 bulan
    const months = [];
    for (let i=5; i>=0; i--) {
      const dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const y = dt.getFullYear(), m = dt.getMonth();
      const tx = d.transaksi.filter(t => { const x=new Date(t.tanggal); return x.getFullYear()===y && x.getMonth()===m; });
      months.push({
        label: BULAN_S[m],
        in: tx.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+(+t.jumlah||0),0),
        out: tx.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+(+t.jumlah||0),0)
      });
    }
    const maxVal = Math.max(1, ...months.map(m=>Math.max(m.in,m.out)));
    const chartHtml = `<div class="chart">${months.map(m=>`<div class="bar-wrap">
        <div class="bar">
          <div class="in" style="height:${(m.in/maxVal)*100}%"></div>
          <div class="out" style="height:${(m.out/maxVal)*100}%"></div>
        </div>
        <div class="lbl">${m.label}</div>
      </div>`).join('')}</div>
      <div class="legend"><span class="in">Masuk</span><span class="out">Keluar</span></div>`;

    return `<div class="topbar"><h1>Dashboard</h1><span style="color:var(--muted);font-size:12px">${UI.fmtDate(new Date())}</span></div>
    <div class="stat-grid">
      <div class="stat"><div class="lbl">Saldo Kas</div><div class="val ${saldo>=0?'pos':'neg'}">${UI.fmt(saldo)}</div></div>
      <div class="stat"><div class="lbl">Pemasukan Bulan Ini</div><div class="val pos">${UI.fmt(inBln)}</div></div>
      <div class="stat"><div class="lbl">Pengeluaran Bulan Ini</div><div class="val neg">${UI.fmt(outBln)}</div></div>
      <div class="stat"><div class="lbl">Tunggakan SPP</div><div class="val ${tunggakan>0?'neg':''}">${UI.fmt(tunggakan)}</div></div>
      <div class="stat"><div class="lbl">Saldo Tabungan</div><div class="val">${UI.fmt(saldoTabungan)}</div></div>
      <div class="stat"><div class="lbl">Murid / Guru</div><div class="val">${d.murid.filter(m=>m.aktif!==false).length} / ${d.guru.length}</div></div>
    </div>
    <div class="card" style="margin-bottom:14px"><h3>Arus Kas 6 Bulan Terakhir</h3>${chartHtml}</div>
    <div class="card"><h2>Transaksi Terbaru</h2>
      ${recent.length ? `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th class="money">Jumlah</th></tr></thead><tbody>
        ${recent.map(t=>`<tr><td>${UI.fmtDate(t.tanggal)}</td><td>${UI.esc(t.keterangan||'-')}</td>
          <td><span class="badge ${t.jenis==='masuk'?'s':'d'}">${UI.esc(t.kategori||t.jenis)}</span></td>
          <td class="money ${t.jenis==='masuk'?'pos':'neg'}">${t.jenis==='masuk'?'+':'-'} ${UI.fmt(t.jumlah)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">Belum ada transaksi.</div>`}
    </div>`;
  },

  /* murid */
  murid() {
    const f = App.muridFilter || (App.muridFilter = { kelas:'', q:'' });
    let list = [...Store.data.murid];
    if (f.kelas) list = list.filter(m => m.kelas === f.kelas);
    if (f.q) { const q = f.q.toLowerCase(); list = list.filter(m => (m.nama||'').toLowerCase().includes(q) || (m.nis||'').toLowerCase().includes(q)); }
    list.sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
    const kelasList = [...new Set(Store.data.murid.map(m=>m.kelas).filter(Boolean))].sort();

    return `<div class="topbar"><h1>Data Murid</h1><button class="primary" data-action="murid-add">+ Tambah Murid</button></div>
    <div class="filter-bar card">
      <select data-filter="muridKelas"><option value="">Semua Kelas</option>${kelasList.map(k=>`<option ${f.kelas===k?'selected':''}>${UI.esc(k)}</option>`).join('')}</select>
      <input placeholder="Cari nama / NIS..." data-filter="muridQ" value="${UI.esc(f.q)}">
      <button class="sm" data-action="export-csv-murid">⬇️ CSV</button>
    </div>
    ${list.length ? `<div class="table-wrap"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>L/P</th><th>Wali</th><th>Telepon</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(m=>`<tr><td>${UI.esc(m.nis||'-')}</td><td><b>${UI.esc(m.nama||'-')}</b></td><td>${UI.esc(m.kelas||'-')}</td><td>${UI.esc(m.jk||'-')}</td>
        <td>${UI.esc(m.wali||'-')}</td><td>${UI.esc(m.telepon||'-')}</td>
        <td><span class="badge ${m.aktif!==false?'s':'w'}">${m.aktif!==false?'Aktif':'Non-aktif'}</span></td>
        <td class="actions-cell"><button class="sm" data-action="murid-edit" data-id="${m.id}">✏️</button><button class="sm danger" data-action="murid-del" data-id="${m.id}">🗑️</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="card empty">Belum ada data murid.</div>`}`;
  },

  /* guru */
  guru() {
    const list = [...Store.data.guru].sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
    return `<div class="topbar"><h1>Data Guru</h1><button class="primary" data-action="guru-add">+ Tambah Guru</button></div>
    ${list.length ? `<div class="table-wrap"><table><thead><tr><th>NIP</th><th>Nama</th><th>Mapel</th><th>Jabatan</th><th>Telepon</th><th></th></tr></thead><tbody>
      ${list.map(g=>`<tr><td>${UI.esc(g.nip||'-')}</td><td><b>${UI.esc(g.nama||'-')}</b></td><td>${UI.esc(g.mapel||'-')}</td><td>${UI.esc(g.jabatan||'-')}</td><td>${UI.esc(g.telepon||'-')}</td>
        <td class="actions-cell"><button class="sm" data-action="guru-edit" data-id="${g.id}">✏️</button><button class="sm danger" data-action="guru-del" data-id="${g.id}">🗑️</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="card empty">Belum ada data guru.</div>`}`;
  },

  /* kelas */
  kelas() {
    const list = [...Store.data.kelas].sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
    return `<div class="topbar"><h1>Data Kelas</h1><button class="primary" data-action="kelas-add">+ Tambah Kelas</button></div>
    ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Nama Kelas</th><th>Wali Kelas</th><th>Jumlah Murid</th><th></th></tr></thead><tbody>
      ${list.map(k=>{ const cnt = Store.data.murid.filter(m=>m.kelas===k.nama&&m.aktif!==false).length; return `<tr><td><b>${UI.esc(k.nama)}</b></td><td>${UI.esc(k.wali||'-')}</td><td>${cnt}</td>
        <td class="actions-cell"><button class="sm" data-action="kelas-edit" data-id="${k.id}">✏️</button><button class="sm danger" data-action="kelas-del" data-id="${k.id}">🗑️</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="card empty">Belum ada kelas. Tambahkan untuk mempermudah filter murid.</div>`}`;
  },

  /* kategori */
  kategori() {
    const list = [...Store.data.kategori].sort((a,b)=>(a.jenis||'').localeCompare(b.jenis||'') || (a.nama||'').localeCompare(b.nama||''));
    return `<div class="topbar"><h1>Kategori Transaksi</h1><button class="primary" data-action="kategori-add">+ Tambah Kategori</button></div>
    ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Jenis</th><th>Jumlah Transaksi</th><th></th></tr></thead><tbody>
      ${list.map(k=>{ const cnt = Store.data.transaksi.filter(t=>t.kategori===k.nama).length; return `<tr><td><b>${UI.esc(k.nama)}</b></td>
        <td><span class="badge ${k.jenis==='masuk'?'s':'d'}">${k.jenis==='masuk'?'Masuk':'Keluar'}</span></td><td>${cnt}</td>
        <td class="actions-cell"><button class="sm" data-action="kategori-edit" data-id="${k.id}">✏️</button><button class="sm danger" data-action="kategori-del" data-id="${k.id}">🗑️</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="card empty">Belum ada kategori. Kategori membantu pengelompokan laporan.</div>`}`;
  },

  /* transaksi */
  transaksi() {
    const f = App.txFilter || (App.txFilter = { bulan:new Date().toISOString().slice(0,7), jenis:'', kategori:'', q:'' });
    let list = [...Store.data.transaksi];
    if (f.bulan) list = list.filter(t=>(t.tanggal||'').startsWith(f.bulan));
    if (f.jenis) list = list.filter(t=>t.jenis===f.jenis);
    if (f.kategori) list = list.filter(t=>t.kategori===f.kategori);
    if (f.q) { const q=f.q.toLowerCase(); list = list.filter(t=>((t.keterangan||'')+' '+(t.kategori||'')).toLowerCase().includes(q)); }
    list.sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'') || (b.id||'').localeCompare(a.id||''));
    const tIn = list.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+(+t.jumlah||0),0);
    const tOut = list.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+(+t.jumlah||0),0);
    const kats = [...new Set(Store.data.transaksi.map(t=>t.kategori).filter(Boolean))].sort();

    return `<div class="topbar"><h1>Transaksi Kas</h1><button class="primary" data-action="tx-add">+ Tambah Transaksi</button></div>
    <div class="filter-bar card no-print">
      <input type="month" data-filter="bulan" value="${UI.esc(f.bulan)}">
      <select data-filter="jenis"><option value="">Semua Jenis</option><option value="masuk" ${f.jenis==='masuk'?'selected':''}>Pemasukan</option><option value="keluar" ${f.jenis==='keluar'?'selected':''}>Pengeluaran</option></select>
      <select data-filter="kategori"><option value="">Semua Kategori</option>${kats.map(k=>`<option ${f.kategori===k?'selected':''}>${UI.esc(k)}</option>`).join('')}</select>
      <input placeholder="Cari keterangan..." data-filter="txQ" value="${UI.esc(f.q)}">
    </div>
    <div class="card no-print" style="margin-bottom:12px;padding:10px 14px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px">
      <span>Masuk: <b class="money pos">${UI.fmt(tIn)}</b></span>
      <span>Keluar: <b class="money neg">${UI.fmt(tOut)}</b></span>
      <span>Selisih: <b class="money">${UI.fmt(tIn-tOut)}</b></span>
    </div>
    ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Jenis</th><th class="money">Jumlah</th><th></th></tr></thead><tbody>
      ${list.map(t=>`<tr><td>${UI.fmtDate(t.tanggal)}</td><td>${UI.esc(t.keterangan||'-')}</td><td>${UI.esc(t.kategori||'-')}</td>
        <td><span class="badge ${t.jenis==='masuk'?'s':'d'}">${t.jenis==='masuk'?'Masuk':'Keluar'}</span></td>
        <td class="money ${t.jenis==='masuk'?'pos':'neg'}">${t.jenis==='masuk'?'+':'-'} ${UI.fmt(t.jumlah)}</td>
        <td class="actions-cell"><button class="sm" data-action="tx-edit" data-id="${t.id}">✏️</button><button class="sm danger" data-action="tx-del" data-id="${t.id}">🗑️</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="card empty">Tidak ada transaksi pada filter ini.</div>`}`;
  },

  /* spp */
  spp() {
    const tahun = App.sppTahun || (App.sppTahun = new Date().getFullYear());
    const f = App.sppFilter || (App.sppFilter = { kelas:'' });
    const tahunList = [...new Set([tahun, ...Store.data.spp.map(s=>s.tahun), new Date().getFullYear()])].filter(Boolean).sort((a,b)=>b-a);
    let murid = [...Store.data.murid].filter(m=>m.aktif!==false);
    if (f.kelas) murid = murid.filter(m => m.kelas===f.kelas);
    murid.sort((a,b)=>(a.kelas||'').localeCompare(b.kelas||'') || (a.nama||'').localeCompare(b.nama||''));
    const list = Store.data.spp.filter(s=>+s.tahun===+tahun);
    const totalTagihan = list.reduce((s,x)=>s+(+x.nominal||0),0);
    const totalLunas = list.filter(s=>s.status==='lunas').reduce((s,x)=>s+(+x.nominal||0),0);
    const kelasList = [...new Set(Store.data.murid.map(m=>m.kelas).filter(Boolean))].sort();

    return `<div class="topbar"><h1>Pembayaran SPP</h1>
      <div class="row no-print">
        <select data-filter="sppTahun" style="min-width:100px">${tahunList.map(y=>`<option ${+y===+tahun?'selected':''}>${y}</option>`).join('')}</select>
        <select data-filter="sppKelas"><option value="">Semua Kelas</option>${kelasList.map(k=>`<option ${f.kelas===k?'selected':''}>${UI.esc(k)}</option>`).join('')}</select>
        <button class="primary" data-action="spp-generate">⚙️ Generate ${tahun}</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="lbl">Total Tagihan ${tahun}</div><div class="val">${UI.fmt(totalTagihan)}</div></div>
      <div class="stat"><div class="lbl">Sudah Lunas</div><div class="val pos">${UI.fmt(totalLunas)}</div></div>
      <div class="stat"><div class="lbl">Tunggakan</div><div class="val neg">${UI.fmt(totalTagihan-totalLunas)}</div></div>
    </div>
    ${murid.length ? murid.map(m => {
      const rows = list.filter(s=>s.muridId===m.id).sort((a,b)=>a.bulan-b.bulan);
      if (!rows.length) return '';
      return `<div class="card" style="margin-bottom:12px">
        <h3>${UI.esc(m.nama)} <span style="font-weight:400;color:var(--muted);font-size:12px">(${UI.esc(m.kelas||'-')} · ${UI.esc(m.nis||'-')})</span></h3>
        <div class="spp-grid">
          ${Array.from({length:12},(_,i)=>{ const s = rows.find(r=>+r.bulan===i+1); if(!s) return `<button disabled style="opacity:.4">${BULAN_S[i]}</button>`;
            return `<button class="xs ${s.status==='lunas'?'success':''}" data-action="spp-toggle" data-id="${s.id}">${BULAN_S[i]} ${s.status==='lunas'?'✓':''}</button>`; }).join('')}
        </div>
        <div class="row" style="margin-top:8px;gap:6px" class="no-print">
          <button class="xs" data-action="spp-bulk" data-id="${m.id}">✓ Lunas 1 Tahun</button>
          <button class="xs" data-action="spp-kuitansi" data-id="${m.id}">🖨️ Kuitansi</button>
        </div>
      </div>`;
    }).join('') : `<div class="card empty">Belum ada murid aktif pada filter ini.</div>`}`;
  },

  /* tabungan */
  tabungan() {
    const list = [...Store.data.tabungan].sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
    const perMurid = {};
    Store.data.tabungan.forEach(t => { perMurid[t.muridId] = (perMurid[t.muridId]||0) + (t.jenis==='setor'?1:-1)*(+t.jumlah||0); });
    const total = Object.values(perMurid).reduce((s,x)=>s+x,0);
    const muridTab = Store.data.murid.filter(m=>perMurid[m.id]);

    return `<div class="topbar"><h1>Tabungan Siswa</h1><button class="primary" data-action="tabung-add">+ Transaksi Tabungan</button></div>
    <div class="stat-grid"><div class="stat"><div class="lbl">Total Saldo Tabungan</div><div class="val">${UI.fmt(total)}</div></div>
      <div class="stat"><div class="lbl">Murid Menabung</div><div class="val">${muridTab.length}</div></div></div>
    <div class="card" style="margin-bottom:14px"><h3>Saldo per Murid</h3>
      ${muridTab.length ? `<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kelas</th><th class="money">Saldo</th></tr></thead><tbody>
        ${muridTab.sort((a,b)=>(a.nama||'').localeCompare(b.nama||'')).map(m=>`<tr><td><b>${UI.esc(m.nama)}</b></td><td>${UI.esc(m.kelas||'-')}</td>
          <td class="money ${perMurid[m.id]>0?'pos':'neg'}">${UI.fmt(perMurid[m.id])}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">Belum ada tabungan.</div>`}
    </div>
    <div class="card"><h3>Riwayat Transaksi Tabungan</h3>
      ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Murid</th><th>Jenis</th><th class="money">Jumlah</th><th>Keterangan</th><th></th></tr></thead><tbody>
        ${list.map(t=>{ const m = Store.find('murid', t.muridId); return `<tr><td>${UI.fmtDate(t.tanggal)}</td><td>${UI.esc(m?.nama||'-')}</td>
          <td><span class="badge ${t.jenis==='setor'?'s':'d'}">${t.jenis==='setor'?'Setor':'Tarik'}</span></td>
          <td class="money ${t.jenis==='setor'?'pos':'neg'}">${UI.fmt(t.jumlah)}</td><td>${UI.esc(t.keterangan||'-')}</td>
          <td><button class="sm danger" data-action="tabung-del" data-id="${t.id}">🗑️</button></td></tr>`; }).join('')}
      </tbody></table></div>` : `<div class="empty">Belum ada transaksi tabungan.</div>`}
    </div>`;
  },

  /* laporan */
  laporan() {
    const f = App.lapFilter || (App.lapFilter = { dari:new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10), sampai:UI.today() });
    const list = Store.data.transaksi.filter(t=>t.tanggal>=f.dari && t.tanggal<=f.sampai).sort((a,b)=>(a.tanggal||'').localeCompare(b.tanggal||''));
    let saldoAwal = 0;
    Store.data.transaksi.forEach(t=>{ if(t.tanggal<f.dari) saldoAwal += (t.jenis==='masuk'?1:-1)*(+t.jumlah||0); });
    let running = saldoAwal;
    const rows = list.map(t=>{ running += (t.jenis==='masuk'?1:-1)*(+t.jumlah||0); return { ...t, saldo:running }; });
    const totalIn = list.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+(+t.jumlah||0),0);
    const totalOut = list.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+(+t.jumlah||0),0);

    // rekap per kategori
    const rekap = {};
    list.forEach(t => { if (!rekap[t.kategori||'-']) rekap[t.kategori||'-'] = { masuk:0, keluar:0 }; rekap[t.kategori||'-'][t.jenis] += (+t.jumlah||0); });

    // tunggakan per kelas
    const tahun = App.sppTahun || new Date().getFullYear();
    const tunggakanKelas = {};
    Store.data.spp.filter(s=>+s.tahun===+tahun && s.status==='belum').forEach(s => {
      const m = Store.find('murid', s.muridId); if (!m) return;
      const k = m.kelas || '-';
      tunggakanKelas[k] = (tunggakanKelas[k]||0) + (+s.nominal||0);
    });

    return `<div class="topbar"><h1>Laporan</h1><button class="primary no-print" data-action="print">🖨️ Cetak / PDF</button></div>
    <div class="filter-bar card no-print">
      <label style="font-size:12px">Dari <input type="date" data-filter="lapDari" value="${UI.esc(f.dari)}" style="width:auto;display:inline-block;margin-left:4px"></label>
      <label style="font-size:12px">Sampai <input type="date" data-filter="lapSampai" value="${UI.esc(f.sampai)}" style="width:auto;display:inline-block;margin-left:4px"></label>
      <button class="sm" data-action="lap-csv">⬇️ CSV</button>
    </div>

    <div class="card" style="margin-bottom:14px">
      <h3 style="text-align:center">${UI.esc(Store.data.settings.namaMadrasah || 'Madrasah')}</h3>
      <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px">Laporan Kas · ${UI.fmtDate(f.dari)} s/d ${UI.fmtDate(f.sampai)}</div>
      <div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th class="money">Masuk</th><th class="money">Keluar</th><th class="money">Saldo</th></tr></thead><tbody>
        <tr><td colspan="5"><i>Saldo awal</i></td><td class="money">${UI.fmt(saldoAwal)}</td></tr>
        ${rows.map(t=>`<tr><td>${UI.fmtDate(t.tanggal)}</td><td>${UI.esc(t.keterangan||'-')}</td><td>${UI.esc(t.kategori||'-')}</td>
          <td class="money pos">${t.jenis==='masuk'?UI.fmt(t.jumlah):''}</td>
          <td class="money neg">${t.jenis==='keluar'?UI.fmt(t.jumlah):''}</td>
          <td class="money">${UI.fmt(t.saldo)}</td></tr>`).join('')}
        <tr style="font-weight:700;background:var(--bg)"><td colspan="3">TOTAL</td>
          <td class="money pos">${UI.fmt(totalIn)}</td><td class="money neg">${UI.fmt(totalOut)}</td><td class="money">${UI.fmt(running)}</td></tr>
      </tbody></table></div>
    </div>

    <div class="card" style="margin-bottom:14px"><h3>Rekap per Kategori (Periode Ini)</h3>
      ${Object.keys(rekap).length ? `<div class="table-wrap"><table><thead><tr><th>Kategori</th><th class="money">Pemasukan</th><th class="money">Pengeluaran</th></tr></thead><tbody>
        ${Object.entries(rekap).map(([k,v])=>`<tr><td>${UI.esc(k)}</td><td class="money pos">${v.masuk?UI.fmt(v.masuk):''}</td><td class="money neg">${v.keluar?UI.fmt(v.keluar):''}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">Tidak ada transaksi.</div>`}
    </div>

    <div class="card" style="margin-bottom:14px"><h3>Tunggakan SPP per Kelas — ${tahun}</h3>
      ${Object.keys(tunggakanKelas).length ? `<div class="table-wrap"><table><thead><tr><th>Kelas</th><th class="money">Tunggakan</th></tr></thead><tbody>
        ${Object.entries(tunggakanKelas).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>`<tr><td>${UI.esc(k)}</td><td class="money neg">${UI.fmt(v)}</td></tr>`).join('')}
        <tr style="font-weight:700;background:var(--bg)"><td>TOTAL</td><td class="money neg">${UI.fmt(Object.values(tunggakanKelas).reduce((s,x)=>s+x,0))}</td></tr>
      </tbody></table></div>` : `<div class="empty">Tidak ada tunggakan.</div>`}
    </div>

    <div class="card"><h3>Rekap SPP Tahun ${tahun}</h3>
      ${(()=>{ const l = Store.data.spp.filter(s=>+s.tahun===+tahun); if(!l.length) return `<div class="empty">Belum ada data SPP.</div>`;
        return `<div class="table-wrap"><table><thead><tr><th>Murid</th><th>Kelas</th>${BULAN_S.map(b=>`<th>${b}</th>`).join('')}<th class="money">Tunggakan</th></tr></thead><tbody>
          ${Store.data.murid.filter(m=>m.aktif!==false).map(m=>{ const rows=l.filter(s=>s.muridId===m.id); if(!rows.length) return '';
            const t = rows.reduce((s,x)=>s+(x.status==='belum'?(+x.nominal||0):0),0);
            return `<tr><td><b>${UI.esc(m.nama)}</b></td><td>${UI.esc(m.kelas||'-')}</td>
              ${Array.from({length:12},(_,i)=>{ const r=rows.find(s=>+s.bulan===i+1); if(!r) return `<td style="color:var(--muted)">-</td>`;
                return `<td>${r.status==='lunas'?'<span class="badge s">✓</span>':'<span class="badge d">✗</span>'}</td>`; }).join('')}
              <td class="money ${t>0?'neg':''}">${t>0?UI.fmt(t):'-'}</td></tr>`; }).join('')}
        </tbody></table></div>`; })()}
    </div>`;
  },

  /* backup */
  backup() {
    return `<div class="topbar"><h1>Backup / Restore</h1></div>
    <div class="card" style="margin-bottom:14px"><h3>📤 Ekspor Data (JSON)</h3>
      <p style="color:var(--muted);font-size:13px">Unduh seluruh data sebagai file JSON.</p>
      <button class="primary" data-action="backup-export">⬇️ Backup JSON</button></div>
    <div class="card" style="margin-bottom:14px"><h3>📥 Impor Data</h3>
      <p style="color:var(--muted);font-size:13px">Data saat ini akan diganti dengan isi file.</p>
      <input type="file" accept="application/json" data-action="backup-import"></div>
    <div class="card" style="margin-bottom:14px"><h3>📊 Ekspor CSV</h3>
      <div class="row"><button data-action="export-csv-tx">Transaksi</button><button data-action="export-csv-spp">SPP</button><button data-action="export-csv-murid">Murid</button></div></div>
    <div class="card" style="border-color:var(--danger)"><h3 style="color:var(--danger)">⚠️ Reset Data</h3>
      <p style="color:var(--muted);font-size:13px">Menghapus SEMUA data kecuali PIN.</p>
      <button class="danger" data-action="reset">Hapus Semua Data</button></div>`;
  },

  /* settings */
  settings() {
    const s = Store.data.settings;
    return `<div class="topbar"><h1>Pengaturan</h1></div>
    <div class="card" style="max-width:640px;margin-bottom:14px"><form data-form="settings">
      <div class="fld"><label>Nama Madrasah</label><input name="namaMadrasah" value="${UI.esc(s.namaMadrasah)}"></div>
      <div class="fld"><label>Alamat</label><input name="alamat" value="${UI.esc(s.alamat)}"></div>
      <div class="fld"><label>Kepala Madrasah</label><input name="kepala" value="${UI.esc(s.kepala)}"></div>
      <div class="fld"><label>Tahun Ajaran</label><input name="tahunAjaran" value="${UI.esc(s.tahunAjaran)}"></div>
      <div class="fld"><label>Nominal SPP Default (Rp)</label><input name="nominalSPP" type="number" min="0" value="${+s.nominalSPP||0}"></div>
      <button class="primary">Simpan</button>
    </form></div>
    <div class="card" style="max-width:640px"><h3>🔐 Ganti PIN</h3><form data-form="changePin">
      <div class="fld"><label>PIN Lama</label><input name="old" type="password" inputmode="numeric" required></div>
      <div class="fld"><label>PIN Baru (min 4 digit)</label><input name="new" type="password" inputmode="numeric" minlength="4" required></div>
      <button class="primary">Ganti PIN</button></form></div>`;
  }
};

/* ---------- DIALOG ---------- */
function openDialog({ title, body, formName, submitText='Simpan', onSubmit }) {
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form method="dialog" data-form="${formName}">
    <div class="dlg-hd">${title}</div>
    <div class="dlg-bd">${body}</div>
    <div class="dlg-ft">
      <button type="button" value="cancel" data-action="dlg-cancel">Batal</button>
      <button class="primary" value="ok">${submitText}</button>
    </div></form>`;
  document.body.appendChild(dlg); dlg._onSubmit = onSubmit; dlg.showModal(); return dlg;
}

/* ---------- ACTIONS ---------- */
const Actions = {
  logout(){ if(UI.confirm('Keluar?')) Auth.logout(); },
  'toggle-theme'(){ Store.data.settings.theme = Store.data.settings.theme==='dark'?'light':'dark'; Store.save(); App.render(); },
  'dlg-cancel'(id, el){ el.closest('dialog').close(); el.closest('dialog').remove(); },

  /* submit handlers */
  'submit_setup'(fd){
    const v = Object.fromEntries(fd);
    if (v.pin !== v.pin2) return UI.toast('PIN tidak sama','error');
    if (v.pin.length < 4) return UI.toast('PIN min 4 digit','error');
    Store.data.settings.namaMadrasah = v.nama || 'Madrasah';
    Store.data.settings.tahunAjaran = v.tahun || Store.data.settings.tahunAjaran;
    Auth.setup(v.pin); UI.toast('Berhasil!','success'); App.render();
  },
  'submit_login'(fd){ const v=Object.fromEntries(fd); if(Auth.login(v.pin)){ UI.toast('Selamat datang','success'); App.render(); } else UI.toast('PIN salah','error'); },
  'submit_settings'(fd){ const v=Object.fromEntries(fd); Object.assign(Store.data.settings,{...v,nominalSPP:+v.nominalSPP||0}); Store.save(); UI.toast('Tersimpan','success'); App.render(); },
  'submit_changePin'(fd){ const v=Object.fromEntries(fd);
    if(String(v.old)!==String(Store.data.settings.pin)) return UI.toast('PIN lama salah','error');
    if(String(v.new).length<4) return UI.toast('PIN baru min 4 digit','error');
    Store.data.settings.pin=String(v.new); Store.save(); UI.toast('PIN diubah','success'); },

  /* generic CRUD submit factory */
  _submitGeneric(coll, validate, fields) {
    return (fd, form) => {
      const v = Object.fromEntries(fd);
      const err = validate && validate(v); if (err) return UI.toast(err,'error');
      const id = form.dataset.id;
      const data = fields ? fields(v) : v;
      if (id) Store.update(coll, id, data); else Store.add(coll, data);
      form.closest('dialog').remove(); UI.toast(id?'Diperbarui':'Ditambahkan','success'); App.render();
    };
  },

  /* murid */
  'murid-add'(){ Actions._muridForm(); },
  'murid-edit'(id){ Actions._muridForm(id); },
  _muridForm(id){
    const m = id ? Store.find('murid',id) : {};
    const dlg = openDialog({
      title: id?'Edit Murid':'Tambah Murid', formName:'murid',
      body: `<div class="fld"><label>Nama *</label><input name="nama" value="${UI.esc(m.nama||'')}" required></div>
        <div class="row"><div class="fld" style="flex:1"><label>NIS</label><input name="nis" value="${UI.esc(m.nis||'')}"></div>
        <div class="fld" style="flex:1"><label>Kelas</label><input name="kelas" value="${UI.esc(m.kelas||'')}"></div></div>
        <div class="fld"><label>Jenis Kelamin</label><select name="jk"><option value="">-</option><option ${m.jk==='L'?'selected':''} value="L">Laki-laki</option><option ${m.jk==='P'?'selected':''} value="P">Perempuan</option></select></div>
        <div class="row"><div class="fld" style="flex:1"><label>Wali Murid</label><input name="wali" value="${UI.esc(m.wali||'')}"></div>
        <div class="fld" style="flex:1"><label>Telepon</label><input name="telepon" value="${UI.esc(m.telepon||'')}"></div></div>
        <div class="fld"><label>Alamat</label><textarea name="alamat" rows="2">${UI.esc(m.alamat||'')}</textarea></div>
        <div class="fld"><label><input type="checkbox" name="aktif" ${m.aktif!==false?'checked':''} style="width:auto"> Aktif</label></div>`
    });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'murid-del'(id){ if(!UI.confirm('Hapus murid ini? SPP & tabungan terkait juga dihapus.')) return;
    Store.remove('murid',id); Store.data.spp=Store.data.spp.filter(s=>s.muridId!==id); Store.data.tabungan=Store.data.tabungan.filter(t=>t.muridId!==id); Store.save();
    UI.toast('Murid dihapus','success'); App.render(); },

  /* guru */
  'guru-add'(){ Actions._guruForm(); },
  'guru-edit'(id){ Actions._guruForm(id); },
  _guruForm(id){
    const g = id ? Store.find('guru',id) : {};
    const dlg = openDialog({ title: id?'Edit Guru':'Tambah Guru', formName:'guru',
      body: `<div class="fld"><label>Nama *</label><input name="nama" value="${UI.esc(g.nama||'')}" required></div>
        <div class="fld"><label>NIP</label><input name="nip" value="${UI.esc(g.nip||'')}"></div>
        <div class="row"><div class="fld" style="flex:1"><label>Mapel</label><input name="mapel" value="${UI.esc(g.mapel||'')}"></div>
        <div class="fld" style="flex:1"><label>Jabatan</label><input name="jabatan" value="${UI.esc(g.jabatan||'')}"></div></div>
        <div class="fld"><label>Telepon</label><input name="telepon" value="${UI.esc(g.telepon||'')}"></div>
        <div class="fld"><label>Alamat</label><textarea name="alamat" rows="2">${UI.esc(g.alamat||'')}</textarea></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'guru-del'(id){ if(!UI.confirm('Hapus guru ini?')) return; Store.remove('guru',id); UI.toast('Dihapus','success'); App.render(); },

  /* kelas */
  'kelas-add'(){ Actions._kelasForm(); },
  'kelas-edit'(id){ Actions._kelasForm(id); },
  _kelasForm(id){
    const k = id ? Store.find('kelas',id) : {};
    const dlg = openDialog({ title: id?'Edit Kelas':'Tambah Kelas', formName:'kelas',
      body: `<div class="fld"><label>Nama Kelas *</label><input name="nama" value="${UI.esc(k.nama||'')}" required placeholder="5A, 6B..."></div>
        <div class="fld"><label>Wali Kelas</label><input name="wali" value="${UI.esc(k.wali||'')}"></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'kelas-del'(id){ if(!UI.confirm('Hapus kelas ini?')) return; Store.remove('kelas',id); UI.toast('Dihapus','success'); App.render(); },

  /* kategori */
  'kategori-add'(){ Actions._kategoriForm(); },
  'kategori-edit'(id){ Actions._kategoriForm(id); },
  _kategoriForm(id){
    const k = id ? Store.find('kategori',id) : {};
    const dlg = openDialog({ title: id?'Edit Kategori':'Tambah Kategori', formName:'kategori',
      body: `<div class="fld"><label>Nama Kategori *</label><input name="nama" value="${UI.esc(k.nama||'')}" required placeholder="SPP, Donasi, ATK..."></div>
        <div class="fld"><label>Jenis</label><select name="jenis"><option value="masuk" ${k.jenis==='masuk'?'selected':''}>Masuk</option><option value="keluar" ${k.jenis==='keluar'?'selected':''}>Keluar</option></select></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'kategori-del'(id){ if(!UI.confirm('Hapus kategori ini?')) return; Store.remove('kategori',id); UI.toast('Dihapus','success'); App.render(); },

  /* transaksi */
  'tx-add'(){ Actions._txForm(); },
  'tx-edit'(id){ Actions._txForm(id); },
  _txForm(id){
    const t = id ? Store.find('transaksi',id) : { tanggal:UI.today(), jenis:'masuk' };
    const kats = Store.data.kategori.map(k=>k.nama);
    const dlg = openDialog({ title: id?'Edit Transaksi':'Tambah Transaksi', formName:'tx',
      body: `<div class="fld"><label>Tanggal *</label><input type="date" name="tanggal" value="${UI.esc(t.tanggal||UI.today())}" required></div>
        <div class="fld"><label>Jenis *</label><select name="jenis"><option value="masuk" ${t.jenis==='masuk'?'selected':''}>Pemasukan</option><option value="keluar" ${t.jenis==='keluar'?'selected':''}>Pengeluaran</option></select></div>
        <div class="fld"><label>Kategori</label><input name="kategori" list="kats" value="${UI.esc(t.kategori||'')}" placeholder="SPP, Donasi, ATK...">
          <datalist id="kats">${kats.map(k=>`<option value="${UI.esc(k)}">`).join('')}</datalist></div>
        <div class="fld"><label>Jumlah (Rp) *</label><input type="number" min="1" name="jumlah" value="${t.jumlah||''}" required></div>
        <div class="fld"><label>Keterangan</label><textarea name="keterangan" rows="2">${UI.esc(t.keterangan||'')}</textarea></div>` });
    if (id) dlg.querySelector('form').dataset.id = id;
  },
  'tx-del'(id){ if(!UI.confirm('Hapus transaksi ini?')) return; Store.remove('transaksi',id); UI.toast('Dihapus','success'); App.render(); },

  /* SPP */
  'spp-generate'(){
    const tahun = App.sppTahun || new Date().getFullYear();
    const murid = Store.data.murid.filter(m=>m.aktif!==false);
    if(!murid.length) return UI.toast('Belum ada murid aktif','error');
    const nominal = +Store.data.settings.nominalSPP || 0;
    if(nominal<=0) return UI.toast('Atur Nominal SPP di Pengaturan dulu','error');
    if(!UI.confirm(`Generate SPP ${tahun} untuk ${murid.length} murid?\nNominal ${UI.fmt(nominal)}/bulan\nMurid yang sudah punya SPP tahun ini dilewati.`)) return;
    let count=0;
    murid.forEach(m=>{
      const exists = Store.data.spp.some(s=>s.muridId===m.id && +s.tahun===+tahun);
      if(exists) return;
      for(let b=1;b<=12;b++){ Store.data.spp.push({ id:Store.id(), muridId:m.id, tahun:+tahun, bulan:b, nominal, status:'belum', tanggalBayar:null }); count++; }
    });
    Store.save(); UI.toast(count?`${count} tagihan dibuat`:'Semua sudah punya SPP','success'); App.render();
  },
  'spp-toggle'(id){
    const s = Store.find('spp', id); if(!s) return;
    const m = Store.find('murid', s.muridId);
    if(s.status==='lunas'){
      if(!UI.confirm(`Batalkan pembayaran ${m?.nama||''} ${BULAN[s.bulan-1]} ${s.tahun}?`)) return;
      Store.update('spp', id, { status:'belum', tanggalBayar:null });
      Store.data.transaksi = Store.data.transaksi.filter(t=>t.referensi!==id); Store.save();
      UI.toast('Dibatalkan','warn');
    } else {
      const tgl = UI.today();
      Store.update('spp', id, { status:'lunas', tanggalBayar:tgl });
      Store.add('transaksi', { tanggal:tgl, jenis:'masuk', kategori:'SPP', keterangan:`SPP ${m?.nama||''} - ${BULAN[s.bulan-1]} ${s.tahun}`, jumlah:+s.nominal, referensi:id });
      UI.toast('Pembayaran dicatat','success');
    }
    App.render();
  },
  'spp-bulk'(muridId){
    const tahun = App.sppTahun || new Date().getFullYear();
    const rows = Store.data.spp.filter(s=>s.muridId===muridId && +s.tahun===+tahun && s.status==='belum');
    if(!rows.length) return UI.toast('Semua sudah lunas','warn');
    const m = Store.find('murid', muridId);
    if(!UI.confirm(`Tandai ${rows.length} tagihan ${tahun} lunas untuk ${m?.nama||''}?\nTotal: ${UI.fmt(rows.reduce((s,x)=>s+(+x.nominal||0),0))}`)) return;
    rows.forEach(s=>{
      const tgl = UI.today();
      Store.update('spp', s.id, { status:'lunas', tanggalBayar:tgl });
      Store.add('transaksi', { tanggal:tgl, jenis:'masuk', kategori:'SPP', keterangan:`SPP ${m?.nama||''} - ${BULAN[s.bulan-1]} ${tahun}`, jumlah:+s.nominal, referensi:s.id });
    });
    UI.toast(`${rows.length} tagihan dilunasi`,'success'); App.render();
  },
  'spp-kuitansi'(muridId){
    const tahun = App.sppTahun || new Date().getFullYear();
    const m = Store.find('murid', muridId);
    const rows = Store.data.spp.filter(s=>s.muridId===muridId && +s.tahun===+tahun && s.status==='lunas');
    if(!rows.length) return UI.toast('Belum ada pembayaran lunas','warn');
    const total = rows.reduce((s,x)=>s+(+x.nominal||0),0);
    const body = `<div class="kuitansi">
      <h3>${UI.esc(Store.data.settings.namaMadrasah||'Madrasah')}</h3>
      <div class="sub">Kuitansi Pembayaran SPP ${tahun}</div>
      <table>
        <tr><td>Nama</td><td><b>${UI.esc(m.nama)}</b></td></tr>
        <tr><td>NIS</td><td>${UI.esc(m.nis||'-')}</td></tr>
        <tr><td>Kelas</td><td>${UI.esc(m.kelas||'-')}</td></tr>
        <tr><td>Bulan Lunas</td><td>${rows.map(r=>BULAN_S[r.bulan-1]).join(', ')}</td></tr>
        <tr><td>Total</td><td><b>${UI.fmt(total)}</b></td></tr>
        <tr><td>Tanggal Cetak</td><td>${UI.fmtDate(UI.today())}</td></tr>
      </table>
      <div style="margin-top:16px;text-align:right;font-size:11px">Bendahara<br><br><br>____________</div>
    </div>`;
    const dlg = openDialog({ title:'Kuitansi', formName:'kuitansi', body, submitText:'🖨️ Cetak',
      onSubmit:()=>{ window.print(); } });
    dlg.querySelector('button[value="ok"]').onclick = (e)=>{ e.preventDefault(); window.print(); };
  },

  /* tabungan */
  'tabung-add'(){
    const murid = Store.data.murid.filter(m=>m.aktif!==false);
    if(!murid.length) return UI.toast('Belum ada murid aktif','error');
    const dlg = openDialog({ title:'Transaksi Tabungan', formName:'tabung',
      body: `<div class="fld"><label>Murid *</label><select name="muridId" required>${murid.map(m=>`<option value="${m.id}">${UI.esc(m.nama)} (${UI.esc(m.kelas||'-')})</option>`).join('')}</select></div>
        <div class="fld"><label>Tanggal *</label><input type="date" name="tanggal" value="${UI.today()}" required></div>
        <div class="fld"><label>Jenis</label><select name="jenis"><option value="setor">Setor</option><option value="tarik">Tarik</option></select></div>
        <div class="fld"><label>Jumlah (Rp) *</label><input type="number" min="1" name="jumlah" required></div>
        <div class="fld"><label>Keterangan</label><input name="keterangan"></div>` });
  },
  'submit_tabung'(fd, form){
    const v = Object.fromEntries(fd);
    if(!v.muridId || !v.jumlah || +v.jumlah<=0) return UI.toast('Data tidak valid','error');
    Store.add('tabungan', { muridId:v.muridId, tanggal:v.tanggal, jenis:v.jenis, jumlah:+v.jumlah, keterangan:v.keterangan||'' });
    form.closest('dialog').remove(); UI.toast('Tersimpan','success'); App.render();
  },
  'tabung-del'(id){ if(!UI.confirm('Hapus transaksi tabungan ini?')) return; Store.remove('tabungan',id); UI.toast('Dihapus','success'); App.render(); },

  /* export/import */
  'backup-export'(){ download(new Blob([JSON.stringify(Store.data,null,2)],{type:'application/json'}), `kas-madrasah-backup-${UI.today()}.json`); UI.toast('Backup diunduh','success'); },
  'backup-import'(id, el){ const file = el.files?.[0]; if(!file) return;
    const r = new FileReader(); r.onload = () => { try {
      const d = JSON.parse(r.result);
      if(!d.settings || !Array.isArray(d.transaksi)) throw new Error('Struktur tidak dikenali');
      if(!UI.confirm('Data saat ini akan DIGANTI. Lanjutkan?')) { el.value=''; return; }
      Store.data = d; Store.save(); UI.toast('Restore berhasil','success'); App.render();
    } catch(e){ UI.toast('File tidak valid: '+e.message,'error'); } el.value=''; };
    r.readAsText(file); },
  'export-csv-tx'(){ const rows=[['Tanggal','Jenis','Kategori','Keterangan','Jumlah']]; Store.data.transaksi.forEach(t=>rows.push([t.tanggal,t.jenis,t.kategori||'',t.keterangan||'',t.jumlah])); downloadCSV(rows,'transaksi.csv'); UI.toast('CSV diunduh','success'); },
  'export-csv-spp'(){ const rows=[['Nama','Kelas','Tahun','Bulan','Nominal','Status','Tanggal Bayar']]; Store.data.spp.forEach(s=>{ const m=Store.find('murid',s.muridId); rows.push([m?.nama||'',m?.kelas||'',s.tahun,BULAN[s.bulan-1],s.nominal,s.status,s.tanggalBayar||'']); }); downloadCSV(rows,'spp.csv'); UI.toast('CSV diunduh','success'); },
  'export-csv-murid'(){ const rows=[['NIS','Nama','Kelas','JK','Wali','Telepon','Alamat','Aktif']]; Store.data.murid.forEach(m=>rows.push([m.nis||'',m.nama,m.kelas||'',m.jk||'',m.wali||'',m.telepon||'',m.alamat||'',m.aktif!==false?'Ya':'Tidak'])); downloadCSV(rows,'murid.csv'); UI.toast('CSV diunduh','success'); },
  'lap-csv'(){ const f = App.lapFilter; const rows=[['Tanggal','Jenis','Kategori','Keterangan','Jumlah']]; Store.data.transaksi.filter(t=>t.tanggal>=f.dari && t.tanggal<=f.sampai).forEach(t=>rows.push([t.tanggal,t.jenis,t.kategori||'',t.keterangan||'',t.jumlah])); downloadCSV(rows,`laporan-${f.dari}-sd-${f.sampai}.csv`); UI.toast('CSV diunduh','success'); },
  'reset'(){ if(!UI.confirm('HAPUS SEMUA DATA? Tidak bisa dibatalkan.')) return; if(!UI.confirm('Yakin?')) return;
    const pin = Store.data.settings.pin; Store.data = Store.default(); Store.data.settings.pin = pin; Store.save(); UI.toast('Direset','warn'); App.render(); },
  'print'(){ window.print(); }
};

/* ---------- DOWNLOAD HELPERS ---------- */
function download(blob, filename){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},100); }
function downloadCSV(rows, filename){ const csv = rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'); download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}), filename); }

/* ---------- SUBMIT GENERIC HANDLERS ---------- */
Actions['submit_murid'] = Actions._submitGeneric('murid',
  v => !v.nama ? 'Nama wajib diisi' : null,
  v => ({ nama:v.nama, nis:v.nis, kelas:v.kelas, jk:v.jk, wali:v.wali, telepon:v.telepon, alamat:v.alamat, aktif:v.aktif==='on' }));
Actions['submit_guru'] = Actions._submitGeneric('guru',
  v => !v.nama ? 'Nama wajib diisi' : null);
Actions['submit_kelas'] = Actions._submitGeneric('kelas',
  v => !v.nama ? 'Nama kelas wajib diisi' : null);
Actions['submit_kategori'] = Actions._submitGeneric('kategori',
  v => !v.nama ? 'Nama kategori wajib diisi' : null);
Actions['submit_tx'] = Actions._submitGeneric('transaksi',
  v => (!v.tanggal || !v.jumlah || +v.jumlah<=0) ? 'Tanggal & jumlah wajib valid' : null,
  v => ({ tanggal:v.tanggal, jenis:v.jenis, kategori:v.kategori||'-', keterangan:v.keterangan||'', jumlah:+v.jumlah }));

/* ---------- EVENT DELEGATION ---------- */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (btn && btn.tagName !== 'INPUT' && btn.tagName !== 'SELECT') {
    const fn = Actions[btn.dataset.action];
    if (fn) { e.preventDefault(); fn(btn.dataset.id, btn); return; }
  }
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); App.nav(nav.dataset.nav); }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = Actions['submit_' + form.dataset.form];
  if (fn) {
    fn(new FormData(form), form);
    const dlg = form.closest('dialog');
    if (dlg && dlg.open) { dlg.close(); if (dlg.parentNode) dlg.remove(); }
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (['bulan','jenis','kategori'].includes(el.dataset.filter)) { App.txFilter = App.txFilter||{}; App.txFilter[el.dataset.filter] = el.value; App.render(); }
  if (el.dataset.filter === 'sppTahun') { App.sppTahun = +el.value; App.render(); }
  if (el.dataset.filter === 'sppKelas') { App.sppFilter = App.sppFilter||{}; App.sppFilter.kelas = el.value; App.render(); }
  if (el.dataset.filter === 'muridKelas') { App.muridFilter = App.muridFilter||{}; App.muridFilter.kelas = el.value; App.render(); }
  if (el.dataset.filter === 'lapDari' || el.dataset.filter === 'lapSampai') { App.lapFilter = App.lapFilter||{}; App.lapFilter[el.dataset.filter==='lapDari'?'dari':'sampai'] = el.value; App.render(); }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.filter === 'muridQ') { clearTimeout(window._mq); window._mq = setTimeout(()=>{ App.muridFilter=App.muridFilter||{}; App.muridFilter.q = el.value; App.render(); }, 250); }
  if (el.dataset.filter === 'txQ') { clearTimeout(window._tq); window._tq = setTimeout(()=>{ App.txFilter=App.txFilter||{}; App.txFilter.q = el.value; App.render(); }, 250); }
});

/* ---------- BOOT ---------- */
Store.load();
App.render();
window.addEventListener('hashchange', () => {
  const v = location.hash.replace('#','');
  if (v && Views[v]) { App.view = v; App.render(); }
});
</script>
